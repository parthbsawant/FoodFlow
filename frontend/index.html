<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFlow</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <a href="">
                <img src="assets/logo/website-logo.jpeg" alt="FoodFlow">
            </a>

            <div class="search-bar">
                <img src="assets/icons/searchbar.png" alt="">
                <label for="searchbar">Search</label>
                <input type="text" name="search" id="searchbar">
            </div>

            <div class="profile-section">
                <img src="assets/icons/notifications.png" alt="">
                <button type="button">
                    Profile Information
                </button>
            </div>
        </header>
        <aside>
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active"><a href="#">Dashboard</a></li>
                    <li class="nav-item"><a href="#">Orders</a></li>
                    <li class="nav-item"><a href="#">Menu</a></li>
                    <li class="nav-item"><a href="#">Customers</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <section class="dashboard-intro">
                <h1>Good morning, Parth!!</h1>
                <p>Here's what's happening at FoodFlow Bistro today.</p>
            </section>

            <section class="summary-section">
                <div class="summary-cards">
                    <div class="summary-cards">
                        <img src="" alt="Total Orders Image">
                        <h3>Total Orders</h3>
                        <p>48</p>
                        <p>vs. Yesterday</p>
                        <img src="" alt="Graph Image">
                    </div>
                    <div class="summary-cards">
                        <img src="" alt="Total Revenue Image">
                        <h3>Today's Revenue</h3>
                        <p>Rs. 18,450</p>
                        <p>vs. Yesterday</p>
                        <img src="" alt="Graph Image">
                    </div>
                    <div class="summary-cards">
                        <img src="" alt="Pending Orders Image">
                        <h3>Pending Orders</h3>
                        <p>12</p>
                        <p>vs. Yesterday</p>
                        <img src="" alt="Graph Image">
                    </div>
                    <div class="summary-cards">
                        <img src="" alt="Completed Orders Image">
                        <h3>Completed Orders</h3>
                        <p>36</p>
                        <p>vs. Yesterday</p>
                        <img src="" alt="Graph Image">
                    </div>
                </div>
            </section>

            <section>
                <!-- Recent Orders Table -->
            </section>

            <section>
                <!-- Quick Action Button Collection -->
            </section>

            <section>
                <!-- Popular Menu Items Table -->
            </section>

            <section>
                <!-- Order Status Overview Display -->
            </section>
        </main>
        <footer>
            FoodFlow
            © 2026
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
